<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parte C - Modelo con primitivas</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>

    <style>
        #volver {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-family: Arial;
        }
    </style>
</head>

<body>

    <a href="index.html" id="volver">← Volver al menú</a>

    <a-scene>

        <!-- Piso -->
        <a-plane
            position="0 0 -5"
            rotation="-90 0 0"
            width="14"
            height="12"
            color="#808080">
        </a-plane>

        <!-- Banda transportadora -->
        <a-entity id="banda" position="0 0 -5">

            <!-- Cinta -->
            <a-box
                position="0 1.5 0"
                width="6"
                height="0.18"
                depth="1.6"
                color="#202020">
            </a-box>

            <!-- Laterales -->
            <a-box
                position="0 1.7 0.85"
                width="6"
                height="0.25"
                depth="0.12"
                color="#C0C0C0">
            </a-box>

            <a-box
                position="0 1.7 -0.85"
                width="6"
                height="0.25"
                depth="0.12"
                color="#C0C0C0">
            </a-box>

            <!-- Rodillos -->
            <a-cylinder
                position="-2.7 1.5 0"
                rotation="90 0 0"
                radius="0.22"
                height="1.7"
                color="#555555">
            </a-cylinder>

            <a-cylinder
                position="2.7 1.5 0"
                rotation="90 0 0"
                radius="0.22"
                height="1.7"
                color="#555555">
            </a-cylinder>

            <!-- Patas delanteras -->
            <a-box
                position="-2.3 0.75 0.65"
                width="0.18"
                height="1.5"
                depth="0.18"
                color="#A0A0A0">
            </a-box>

            <a-box
                position="2.3 0.75 0.65"
                width="0.18"
                height="1.5"
                depth="0.18"
                color="#A0A0A0">
            </a-box>

            <!-- Patas traseras -->
            <a-box
                position="-2.3 0.75 -0.65"
                width="0.18"
                height="1.5"
                depth="0.18"
                color="#A0A0A0">
            </a-box>

            <a-box
                position="2.3 0.75 -0.65"
                width="0.18"
                height="1.5"
                depth="0.18"
                color="#A0A0A0">
            </a-box>

            <!-- Motor -->
            <a-cylinder
                position="2.7 1.5 -1.15"
                rotation="90 0 0"
                radius="0.38"
                height="0.5"
                color="#1565C0">
            </a-cylinder>

            <!-- Soporte del sensor -->
            <a-box
                position="0 2.3 -0.9"
                width="0.12"
                height="1.4"
                depth="0.12"
                color="#404040">
            </a-box>

            <a-box
                position="0 2.95 -0.35"
                width="0.12"
                height="0.12"
                depth="1.1"
                color="#404040">
            </a-box>

            <!-- Sensor -->
            <a-sphere
                position="0 2.95 0.25"
                radius="0.18"
                color="#FF0000">
            </a-sphere>

            <!-- Producto sobre la banda -->
            <a-box
                position="-1 1.85 0"
                width="0.7"
                height="0.5"
                depth="0.7"
                color="#FFC107">
            </a-box>

        </a-entity>

        <!-- Cielo -->
        <a-sky color="#ECECEC"></a-sky>

    </a-scene>

</body>

</html>
